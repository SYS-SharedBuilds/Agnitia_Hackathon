[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "switchon"
version = "1.0.0"
description = "SwitchOn Telecom Service Activation Orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "sse-starlette>=2.0.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "networkx>=3.2.1",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "respx>=0.21.1",
    "hypothesis>=6.98.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.12",
    "types-redis>=4.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "services*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-p no:launch_ros -p no:launch_testing -ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = [".", "shared", "services/orchestrator", "services/order_api", "services/mocks"]
