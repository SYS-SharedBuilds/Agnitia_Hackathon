openapi: 3.0.3
info:
  title: SwitchOn Order API
  version: 1.0.0
  description: Order activation gateway, read-model queries, SSE, metrics, and certificates.
paths:
  /orders:
    post:
      summary: Submit order for activation
      operationId: submitOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '202':
          description: Accepted for orchestration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    get:
      summary: List orders
      operationId: listOrders
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: product
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
  /orders/{order_id}:
    get:
      summary: Get order detail with tasks
      operationId: getOrderDetail
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          description: Order not found
  /orders/{order_id}/events:
    get:
      summary: Get order event history (supports upto_seq time travel)
      operationId: getOrderEvents
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
        - name: upto_seq
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventItem'
  /orders/{order_id}/certificate:
    get:
      summary: Get Ed25519-signed consistency certificate
      operationId: getOrderCertificate
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Signed certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
  /orders/{order_id}/cancel:
    post:
      summary: Cancel in-flight order
      operationId: cancelOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
        - name: reason
          in: query
          schema:
            type: string
            default: Operator signal
      responses:
        '200':
          description: Cancellation signaled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  order_id:
                    type: string
  /orders/{order_id}/resolve:
    post:
      summary: Manually resolve order in NEEDS_ATTENTION state
      operationId: resolveOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
        - name: note
          in: query
          schema:
            type: string
            default: Manually cleared by operator
      responses:
        '200':
          description: Manual resolution signaled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  order_id:
                    type: string
  /certificates/verify:
    post:
      summary: Verify consistency certificate offline or online
      operationId: verifyCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  reason:
                    type: string
components:
  schemas:
    OrderCreateRequest:
      type: object
      required:
        - client_order_ref
        - customer_id
        - product
      properties:
        client_order_ref:
          type: string
        customer_id:
          type: string
        product:
          type: string
        msisdn:
          type: string
        iccid:
          type: string
    OrderResponse:
      type: object
      properties:
        order_id:
          type: string
        workflow_id:
          type: string
        state:
          type: string
        product:
          type: string
        idempotent_replay:
          type: boolean
    OrderSummary:
      type: object
      properties:
        order_id:
          type: string
        client_order_ref:
          type: string
        customer_id:
          type: string
        product:
          type: string
        state:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        activation_ms:
          type: integer
    OrderDetail:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/OrderSummary'
        tasks:
          type: array
          items:
            type: object
    EventItem:
      type: object
      properties:
        event_id:
          type: string
        order_id:
          type: string
        seq:
          type: integer
        ts:
          type: string
        type:
          type: string
        task_id:
          type: string
        payload:
          type: object
    Certificate:
      type: object
      properties:
        order_id:
          type: string
        outcome:
          type: string
        catalog_version:
          type: integer
        events_digest:
          type: string
        system_state:
          type: object
        invariants:
          type: array
          items:
            type: object
        issued_at:
          type: string
        signature:
          type: string
        key_id:
          type: string
